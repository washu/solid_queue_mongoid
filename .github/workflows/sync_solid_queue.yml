name: Monitor solid_queue Upstream

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_tag:
        description: "Override solid_queue tag to compare against (e.g. v1.5.0). Leave blank to use latest."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    name: Check for new solid_queue release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Determine latest solid_queue release ──────────────────────────────
      - name: Get latest solid_queue release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.force_tag }}" ]; then
            LATEST_TAG="${{ github.event.inputs.force_tag }}"
          else
            LATEST_TAG=$(gh release view --repo rails/solid_queue --json tagName -q '.tagName')
          fi
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "Upstream latest tag: ${LATEST_TAG}"

      # ── Compare with last processed version ───────────────────────────────
      - name: Read last checked version
        id: last_version
        run: |
          LAST=$(cat .github/last_checked_solid_queue_version | tr -d '[:space:]')
          echo "last_tag=${LAST}" >> "$GITHUB_OUTPUT"
          echo "Last checked tag: ${LAST}"

      - name: Check if update is needed
        id: needs_update
        run: |
          LATEST="${{ steps.upstream.outputs.latest_tag }}"
          LAST="${{ steps.last_version.outputs.last_tag }}"
          if [ "$LATEST" = "$LAST" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No new release. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release detected: ${LATEST} (last checked: ${LAST})"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Check if an issue for this version already exists ─────────────────
      - name: Check for existing sync issue
        id: issue_check
        if: steps.needs_update.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          EXISTING=$(gh issue list --label "upstream-sync" --state open --search "$TAG" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Open issue #${EXISTING} already exists for ${TAG}. Skipping."
            echo "issue_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "issue_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Set up Ruby for the comparison script ─────────────────────────────
      - name: Set up Ruby
        if: |
          steps.needs_update.outputs.proceed == 'true' &&
          steps.issue_check.outputs.issue_exists == 'false'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # ── Run comparison script ─────────────────────────────────────────────
      - name: Compare models
        if: |
          steps.needs_update.outputs.proceed == 'true' &&
          steps.issue_check.outputs.issue_exists == 'false'
        id: compare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_TAG="${{ steps.last_version.outputs.last_tag }}"
          NEW_TAG="${{ steps.upstream.outputs.latest_tag }}"
          # Compare upstream old tag vs new tag — NOT vs our local models
          ruby .github/scripts/compare_models.rb "$OLD_TAG" "$NEW_TAG" > /tmp/issue_body.md
          echo "--- Issue Body Preview ---"
          cat /tmp/issue_body.md

      # ── Always bump version tracking on default branch ───────────────────
      - name: Update version tracking file
        if: |
          steps.needs_update.outputs.proceed == 'true' &&
          steps.issue_check.outputs.issue_exists == 'false' &&
          steps.compare.conclusion == 'success'
        run: |
          TAG="${{ steps.upstream.outputs.latest_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$TAG" > .github/last_checked_solid_queue_version
          git add .github/last_checked_solid_queue_version
          git diff --cached --quiet || git commit -m "chore: track solid_queue upstream version ${TAG}"
          git push origin HEAD

      # ── Create issue and assign to Copilot if there are model changes ─────
      - name: Create Copilot issue for model changes
        if: |
          steps.needs_update.outputs.proceed == 'true' &&
          steps.issue_check.outputs.issue_exists == 'false' &&
          steps.compare.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only open an issue if there are actual upstream model changes
          if grep -q "No model changes detected" /tmp/issue_body.md; then
            echo "No model changes — skipping issue creation."
            exit 0
          fi

          OLD_TAG="${{ steps.last_version.outputs.last_tag }}"
          NEW_TAG="${{ steps.upstream.outputs.latest_tag }}"
          TITLE="chore: solid_queue ${OLD_TAG} → ${NEW_TAG} — update Mongoid models for upstream changes"

          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/issue_body.md \
            --label "upstream-sync" \
            --assignee "Copilot"
